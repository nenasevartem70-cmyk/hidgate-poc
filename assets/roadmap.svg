<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="CVE-2026-28992 research roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b10"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="done" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27c93f"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#ff5f56"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1a2633" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="330" fill="url(#bg)"/>
  <rect width="1100" height="330" fill="url(#grid)" opacity="0.25"/>

  <text x="40" y="48" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">Research roadmap</text>
  <text x="40" y="72" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Crash &#8594; Control &#8594; Jailbreak</text>

  <line x1="120" y1="150" x2="980" y2="150" stroke="#25384a" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="150" x2="490" y2="150" stroke="url(#done)" stroke-width="6" stroke-linecap="round"/>
  <line x1="490" y1="150" x2="650" y2="150" stroke="url(#active)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <circle cx="120" cy="150" r="13" fill="#27c93f" stroke="#0b1219" stroke-width="4"/>
    <text x="120" y="112" fill="#27c93f" font-size="13" font-weight="700">UAF</text>
    <text x="120" y="195" fill="#8fa6bb" font-size="11">reproducible</text>
    <text x="120" y="211" fill="#6f8498" font-size="10">panic</text>

    <circle cx="300" cy="150" r="13" fill="#27c93f" stroke="#0b1219" stroke-width="4"/>
    <text x="300" y="112" fill="#27c93f" font-size="13" font-weight="700">PHASE A</text>
    <text x="300" y="195" fill="#8fa6bb" font-size="11">close / open</text>
    <text x="300" y="211" fill="#6f8498" font-size="10">thread-named</text>

    <circle cx="490" cy="150" r="13" fill="#ffb86b" stroke="#0b1219" stroke-width="4"/>
    <text x="490" y="112" fill="#ffb86b" font-size="13" font-weight="700">CONTROL</text>
    <text x="490" y="195" fill="#8fa6bb" font-size="11">reclaim object</text>
    <text x="490" y="211" fill="#6f8498" font-size="10">in progress</text>

    <circle cx="680" cy="150" r="13" fill="#2b4053" stroke="#0b1219" stroke-width="4"/>
    <text x="680" y="112" fill="#8fa6bb" font-size="13" font-weight="700">KASLR</text>
    <text x="680" y="195" fill="#6f8498" font-size="11">runtime leak</text>
    <text x="680" y="211" fill="#4e6478" font-size="10">not yet</text>

    <circle cx="850" cy="150" r="13" fill="#2b4053" stroke="#0b1219" stroke-width="4"/>
    <text x="850" y="112" fill="#8fa6bb" font-size="13" font-weight="700">KERNEL R/W</text>
    <text x="850" y="195" fill="#6f8498" font-size="11">fake vtable / ROP</text>
    <text x="850" y="211" fill="#4e6478" font-size="10">not yet</text>

    <circle cx="980" cy="150" r="13" fill="#2b4053" stroke="#0b1219" stroke-width="4"/>
    <text x="980" y="112" fill="#8fa6bb" font-size="13" font-weight="700">JAILBREAK</text>
    <text x="980" y="195" fill="#6f8498" font-size="11">PAC / PPL / SPTM</text>
    <text x="980" y="211" fill="#4e6478" font-size="10">not yet</text>
  </g>

  <rect x="40" y="270" width="1020" height="1" fill="#25384a"/>
  <text x="40" y="300" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Current: stable crash primitive on iOS 18.7.2 / iPhone XR (A12). Control is the active research stage.</text>
</svg>
