  <rect x="40" y="234" width="1020" height="1" fill="#25384a"/>
  <text x="40" y="260" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Test target: iPhone XR (A12) &#183; 18.7.2 (22H124) &#183; known crash, no kernel r/w</text>
