<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="CVE-2026-28992 kernel data abort hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="0.6" stop-color="#0b131d"/>
      <stop offset="1" stop-color="#121d29"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.5" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1118"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2633" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.3"/>
  <circle cx="1010" cy="150" r="230" fill="#ff4d4d" opacity="0.12" filter="url(#blur)"/>
  <circle cx="1080" cy="460" r="220" fill="#ff9f43" opacity="0.08" filter="url(#blur)"/>

  <text x="64" y="86" fill="#8fa6bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5">SECURITY RESEARCH / APP-REACHABLE KERNEL UAF</text>

  <text x="62" y="168" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="800" letter-spacing="1">KERNEL</text>
  <text x="62" y="236" fill="#f5f7fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="800" letter-spacing="1">DATA ABORT</text>

  <rect x="64" y="270" width="560" height="3" fill="url(#hot)"/>

  <text x="64" y="318" fill="#ffb86b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">CVE-2026-28992</text>
  <text x="64" y="352" fill="#c7d5e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">IOHIDFamily FastPathUserClient</text>
  <text x="64" y="382" fill="#8fa6bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">race / use-after-free &#8594; corrupted virtual call</text>

  <g transform="translate(64 430)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#1a0d10" stroke="#ff5f56"/>
    <text x="95" y="27" fill="#ff5f56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">iOS 18.7.2 &#183; A12</text>

    <rect x="210" y="0" width="190" height="42" rx="21" fill="#1a140b" stroke="#ffb86b"/>
    <text x="305" y="27" fill="#ffb86b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">crash PoC</text>

    <rect x="420" y="0" width="210" height="42" rx="21" fill="#0b1a12" stroke="#27c93f"/>
    <text x="525" y="27" fill="#27c93f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">not a jailbreak</text>
  </g>

  <text x="64" y="518" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">hidgate4 &#183; iPhone XR (iPhone11,8) &#183; xnu-11417.140.69.702.20~1</text>

  <g transform="translate(860 56)">
    <rect x="0" y="0" width="270" height="448" rx="38" fill="#0a0f15" stroke="#2b4053" stroke-width="2"/>
    <rect x="12" y="14" width="246" height="420" rx="27" fill="url(#screen)" stroke="#1a2633"/>
    <rect x="96" y="22" width="78" height="18" rx="9" fill="#0a0f15" stroke="#1a2633"/>

    <text x="30" y="74" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">hidgate4.log</text>
    <text x="30" y="100" fill="#8fa6bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">build=hidgate4</text>
    <text x="30" y="122" fill="#c7d5e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">svc[92] AppleSPUHIDDriver</text>
    <text x="30" y="144" fill="#27c93f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">gate_ok=16</text>
    <text x="30" y="166" fill="#c7d5e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">probe_ok=2408</text>
    <text x="30" y="188" fill="#ffb86b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">racing 120s...</text>

    <rect x="22" y="212" width="226" height="176" rx="10" fill="#1a0d10" stroke="#ff5f56"/>
    <text x="36" y="240" fill="#ff5f56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">PANIC</text>
    <text x="36" y="264" fill="#e6b7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Kernel data abort</text>
    <text x="36" y="286" fill="#c7d5e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">pc  0xfffffff02405c388</text>
    <text x="36" y="304" fill="#ffb86b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">x16 0x0020000000000000</text>
    <text x="36" y="322" fill="#ffb86b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">far 0x0020000000000038</text>
    <text x="36" y="340" fill="#c7d5e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">esr 0x96000004</text>
    <text x="36" y="362" fill="#8fa6bb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">ldr x8, [x16, #0x38]!</text>

    <text x="30" y="414" fill="#6f8498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">IOHIDFamily / AppleSPU</text>
  </g>

  <path d="M 820 280 C 760 280 740 300 720 300" fill="none" stroke="#ff5f56" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <circle cx="718" cy="300" r="4" fill="#ff5f56"/>
</svg>
